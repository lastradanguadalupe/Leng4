<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso & Registro | Portfolio Fullstack</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236049ea'><circle cx='12' cy='12' r='10'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center py-5">

  <div class="grain-overlay"></div>

  <div class="container my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        
        <!-- Volver a la Home -->
        <div class="text-center mb-4">
          <a href="/index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-white-50 small">
            <span>← Volver al Portfolio</span>
          </a>
          <h2 class="fw-bold mt-2 text-white">Portal de Usuarios</h2>
          <p class="text-white-50 small">Accede a las demos interactivas, código sandbox y paneles de gestión</p>
        </div>

        <div class="card p-4 p-md-5">
          <!-- Pestañas de Alternancia -->
          <div class="d-flex border-bottom border-secondary mb-4 pb-2">
            <button class="btn btn-link text-decoration-none flex-fill text-center fw-bold text-white active" id="tab-login">
              Iniciar Sesión
            </button>
            <button class="btn btn-link text-decoration-none flex-fill text-center fw-bold text-white-50" id="tab-register">
              Crear Cuenta
            </button>
          </div>

          <!-- Botón de Google OAuth -->
          <div class="mb-4">
            <button type="button" class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2 btn-google-auth">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
                <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/>
                <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
              </svg>
              <span>Continuar con Google</span>
            </button>
          </div>

          <div class="position-relative text-center my-3">
            <hr class="border-secondary m-0">
            <span class="position-absolute top-50 start-50 translate-middle px-3 text-white-50 small" style="background: var(--color-surface-card);">o mediante email</span>
          </div>

          <!-- 1. CAJA DE INICIO DE SESIÓN -->
          <div id="form-login-box">
            <form id="form-login">
              <div class="mb-3">
                <label class="form-label small text-white-50" for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" name="email" class="form-control" placeholder="tu@email.com" required>
              </div>
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label small text-white-50 mb-0" for="login-pass">Contraseña</label>
                  <a href="#" id="link-forgot-password" class="small text-accent text-decoration-none">¿Olvidaste tu clave?</a>
                </div>
                <input type="password" id="login-pass" name="password" class="form-control mt-1" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-accent-custom w-100 py-2 mt-2">
                Ingresar
              </button>
            </form>
          </div>

          <!-- 2. CAJA DE REGISTRO -->
          <div id="form-register-box" style="display: none;">
            <form id="form-register">
              <div class="mb-3">
                <label class="form-label small text-white-50" for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" name="full_name" class="form-control" placeholder="Ej: Mateo Silva" required>
              </div>
              <div class="mb-3">
                <label class="form-label small text-white-50" for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" name="email" class="form-control" placeholder="mateo@empresa.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label small text-white-50" for="reg-pass">Contraseña (Mínimo 6 caracteres)</label>
                <input type="password" id="reg-pass" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
              </div>
              <div class="mb-3">
                <label class="form-label small text-white-50" for="reg-pass-confirm">Confirmar Contraseña</label>
                <input type="password" id="reg-pass-confirm" name="password_confirm" class="form-control" placeholder="••••••••" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-accent-custom w-100 py-2 mt-2">
                Crear Cuenta
              </button>
            </form>
          </div>

          <!-- 3. CAJA DE RECUPERACIÓN DE CONTRASEÑA -->
          <div id="form-reset-box" style="display: none;">
            <p class="text-white-50 small mb-3">
              Ingresa el correo asociado a tu cuenta y te enviaremos las instrucciones para restablecer tu contraseña.
            </p>
            <form id="form-reset">
              <div class="mb-3">
                <label class="form-label small text-white-50" for="reset-email">Correo Electrónico</label>
                <input type="email" id="reset-email" name="email" class="form-control" placeholder="tu@email.com" required>
              </div>
              <button type="submit" class="btn btn-accent-custom w-100 py-2 mb-2">
                Enviar enlace de recuperación
              </button>
              <div class="text-center">
                <a href="#" id="link-back-to-login" class="small text-white-50 text-decoration-none">← Volver a inicio de sesión</a>
              </div>
            </form>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/pages/auth-page.js"></script>
</body>
</html>
