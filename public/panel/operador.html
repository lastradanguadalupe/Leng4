<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Operador | Gestión de Consultas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236049ea'><circle cx='12' cy='12' r='10'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="py-4">

  <div class="grain-overlay"></div>

  <!-- Header del Panel -->
  <header class="container mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 border-bottom border-secondary gap-3">
      <div>
        <a href="/index.html" class="text-white-50 small text-decoration-none d-block mb-1">← Volver al Portfolio</a>
        <div class="d-flex align-items-center gap-3">
          <h2 class="fw-bold mb-0 text-white">Panel de Operador</h2>
          <span class="badge badge-accent">Atención de Mensajes</span>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a href="/panel/admin.html" id="link-panel-admin" class="btn btn-outline-custom btn-sm" hidden>⚡ Ir a Panel Admin</a>
        <a href="/index.html" class="btn btn-outline-custom btn-sm">Ver Sitio</a>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="container">
    
    <!-- Filtros de Búsqueda y Estado -->
    <div class="card p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-white-50">🔍</span>
            <input type="text" id="search-consultas" class="form-control" placeholder="Buscar por nombre, email, asunto...">
          </div>
        </div>
        <div class="col-sm-6 col-md-3">
          <select id="filter-tipo" class="form-select">
            <option value="todos">Todos los tipos</option>
            <option value="general">Consulta General</option>
            <option value="cotizacion">Cotización</option>
            <option value="asesoria">Asesoría Técnica</option>
          </select>
        </div>
        <div class="col-sm-6 col-md-3">
          <select id="filter-estado" class="form-select">
            <option value="todos">Todos los estados</option>
            <option value="nueva">Nuevas</option>
            <option value="en_seguimiento">En Seguimiento</option>
            <option value="respondida">Respondidas</option>
          </select>
        </div>
        <div class="col-md-1 text-md-end">
          <button class="btn btn-outline-custom w-100" onclick="window.location.reload();" title="Recargar">↻</button>
        </div>
      </div>
    </div>

    <!-- Tabla de Consultas -->
    <div class="card overflow-hidden">
      <div class="table-responsive">
        <table class="table table-dark table-hover mb-0">
          <thead>
            <tr>
              <th scope="col" style="width: 130px;">Estado</th>
              <th scope="col" style="width: 140px;">Tipo</th>
              <th scope="col">Remitente</th>
              <th scope="col">Asunto / Resumen</th>
              <th scope="col" style="width: 160px;">Fecha</th>
              <th scope="col" style="width: 110px;">Acción</th>
            </tr>
          </thead>
          <tbody id="consultas-list-tbody">
            <!-- Cargado dinámicamente con JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/operador.js"></script>
</body>
</html>
